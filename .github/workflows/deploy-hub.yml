# NOTE: This file lives on the default branch (main) because GitHub Actions
# only runs schedule/workflow_dispatch triggers from the default branch.
# It operates on the easytier-hub branch (see the explicit ref: below).
# Deploy the EasyTier Hub Worker (easytier-js/examples/hub) to Cloudflare.
# Manual only (workflow_dispatch): a deploy is a production change to the live
# relay, so it never runs on push or on sync. The Hub is pinned to EasyTier
# 2.7.0; this workflow deploys the checked-out code as-is and changes nothing.
#
# Build chain (mirrors .github/workflows/js.yml plus the manual
# ~/workspace/easytier-hub-build/deploy-hub.py, whose wrangler invocation this
# reuses): Rust 1.95 + wasm32-wasip1 + protoc build the @easytier/cloudflare
# WASM from source, then `wrangler deploy` runs in the hub directory with
# CLOUDFLARE_API_TOKEN. The Worker secrets the Hub needs
# (EASYTIER_NETWORK_SECRET, REPORT_TOKEN, DASH_USER, DASH_PASS) already live
# on the deployed Worker; wrangler deploy keeps them.
name: Deploy EasyTier Hub

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Hub Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: easytier-hub

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
          target: wasm32-wasip1
          cache: false
          rustflags: ""

      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm --dir easytier-js install --frozen-lockfile

      - name: Build @easytier/cloudflare (WASM + types)
        run: pnpm --dir easytier-js --filter @easytier/cloudflare build

      - name: Deploy Hub to Cloudflare Workers
        working-directory: easytier-js/examples/hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
