# NOTE: This file lives on the default branch (main) because GitHub Actions
# only runs schedule/workflow_dispatch triggers from the default branch.
# It operates on the easytier-hub branch (see the explicit ref: below).
# Deploy the EasyTier Hub Worker (easytier-js/examples/hub) to Cloudflare.
# Manual only (workflow_dispatch): a deploy is a production change to the live
# relay, so it never runs on push or on sync. The Hub is pinned to EasyTier
# 2.7.0; this workflow deploys the checked-out code as-is and changes nothing.
#
# Build chain (mirrors .github/workflows/js.yml plus the manual
# ~/workspace/easytier-hub-build/deploy-hub.py, whose wrangler invocation this
# reuses): Rust 1.95 + wasm32-wasip1 + protoc build the @easytier/cloudflare
# WASM from source, then `wrangler deploy` runs in the hub directory with
# CLOUDFLARE_API_TOKEN. The Worker secrets the Hub needs
# (EASYTIER_NETWORK_SECRET, REPORT_TOKEN, DASH_USER, DASH_PASS) already live
# on the deployed Worker; wrangler deploy keeps them.
#
# Known wrangler quirk (2026-11-14): `wrangler deploy` exits 1 even when the
# Worker code uploads fine, because updating the custom-domain trigger for
# et.yi.uy fails with [code: 100117] — that hostname has externally managed
# DNS records, so wrangler cannot re-attach it. The domain is already bound
# and keeps working; only wrangler's re-attach attempt errors. The deploy
# step therefore uses continue-on-error, and the job's real verdict comes
# from the Verify step below (Worker modified_on must advance).
name: Deploy EasyTier Hub

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Hub Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: easytier-hub

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
          target: wasm32-wasip1
          cache: false
          rustflags: ""

      - uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm --dir easytier-js install --frozen-lockfile

      - name: Build @easytier/cloudflare (WASM + types)
        run: pnpm --dir easytier-js --filter @easytier/cloudflare build

      - name: Record current Worker modified_on
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          before=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/6a207d2f08a68cc996b48478d1cf9224/workers/scripts?per_page=100" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print([w['modified_on'] for w in d['result'] if w['id']=='easytier-hub'][0])")
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "Worker modified_on before deploy: $before"

      - name: Deploy Hub to Cloudflare Workers
        id: deploy
        working-directory: easytier-js/examples/hub
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy

      - name: Verify the Worker code deployed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BEFORE: ${{ steps.before.outputs.before }}
        run: |
          after=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/6a207d2f08a68cc996b48478d1cf9224/workers/scripts?per_page=100" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print([w['modified_on'] for w in d['result'] if w['id']=='easytier-hub'][0])")
          echo "Worker modified_on after deploy: $after (was $BEFORE)"
          if [ "$after" = "$BEFORE" ]; then
            echo "::error::Worker code did not deploy (modified_on unchanged)."
            exit 1
          fi
          echo "Worker code deployed."
